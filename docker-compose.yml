# Nexo (Clean Architecture) — despliegue con Docker Compose.
#
# Solo backend: la API se publica en API_PORT (8080 por defecto), sin proxy Nginx.
# El Cubicador (cubicador/, con su propio docker-compose.yml) se comunica solo por las colas del
# RabbitMQ de abajo (ConnectionStrings:RabbitMq). Sin la compuerta de paridad (Cubicacion__Paridad*)
# el plan de cargue responde 503 "en verificación", sin fallback.
# El servicio 'db' local está deshabilitado: se usa la BD real de ConnectionStrings__Nexo (.env).
#
# Uso:
#   1) cp .env.example .env y completar los valores (mínimo ConnectionStrings__Nexo).
#   2) docker compose up -d --build
#   3) La API queda en http://localhost:${API_PORT:-8080} (health en /health).
#   4) Datos demo (opcional, alternativa a MIGRATE_ON_STARTUP=true):
#        docker compose --profile seed run --rm seed

name: nexo

services:

  rabbit:
    # Imagen propia: el plugin de retardo que MassTransit necesita para los timeouts
    # de saga no viene en la oficial. Ver build/Dockerfile.rabbit.
    build:
      context: .
      dockerfile: build/Dockerfile.rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:

      - "${RABBITMQ_UI_PORT:-15672}:15672"
      # AMQP publicado al host solo para herramientas/CI que operan fuera de Docker
      # (cubicador/scripts/ci_docker_smoke.py); api y cubicador usan la red interna. No exponer en producción.
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Nexo.Api/Dockerfile
    depends_on:
      rabbit:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Nexo: ${ConnectionStrings__Nexo}
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER:-nexo}:${RABBITMQ_PASSWORD}@rabbit:5672/"
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP}
      # Siembra datos de demostración al arrancar si la BD está vacía (idempotente).
      # Poner en "false" en producción real una vez cargados los datos definitivos.
      Database__SeedOnStartup: ${SEED_ON_STARTUP:-true}
      # Esquema propio de NEXO dentro de ConnectionStrings__Nexo (ver clsEsquemaNexo.cs).
      Database__Esquema: ${Database__Esquema}
      Cors__OrigenesPermitidos: ${ORIGENES_PERMITIDOS_CORS}
      # Recálculo del score persistido. El reloj vive en el broker, no en este proceso: cambiar el
      # intervalo solo afecta cada cuánto suena, sin temporizadores duplicados por réplica.
      Score__IntervaloRecalculoMinutos: ${SCORE_INTERVALO_MINUTOS:-15}
      # Solicitudes por lote: evita transacciones largas que bloqueen filas que lee la bandeja.
      Score__TamanoDeLoteRecalculo: ${SCORE_TAMANO_LOTE:-200}
      # Identidad del portal de la Administración. Vacía en local: cae al
      # adapter que resuelve contra la tabla Usuarios propia (ver .env.example).
      # ASPNETCORE_ENVIRONMENT=Production EXIGE esta cadena (fail-closed).
      ConnectionStrings__IdentidadPortal: ${ConnectionStrings__IdentidadPortal}
      # Data Warehouse corporativo (SOLO LECTURA). Opcionales: si van vacías,
      # los módulos que las usan (Biblioteca/SICE-TAC/histórico/clientes DW)
      # se degradan solos (503 accionable o Configurado=false), no rompen.
      ConnectionStrings__DwSice: ${ConnectionStrings__DwSice}
      ConnectionStrings__DwCubos: ${ConnectionStrings__DwCubos}
      # Conexión SAP nueva: plaza en vivo. Deshabilitado por defecto —
      # la plaza real sigue saliendo de DbSolucionesTi, sin tocar.
      SapTarifaFleteEnVivo__Modo: ${SAP_TARIFA_FLETE_EN_VIVO_MODO}
      ConnectionStrings__DbSolucionesTi: ${ConnectionStrings__DbSolucionesTi}
      # SMTP corporativo (envío de cotizaciones). Opcional: sin Host/Remitente no
      # envía. Nombres en español: SmtpCorreoAdapter lee Smtp:Puerto/Remitente/
      # Usuario/Clave (no Port/From/User/Password).
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Puerto: ${Smtp__Puerto:-}
      Smtp__Ssl: ${Smtp__Ssl:-}
      Smtp__Remitente: ${Smtp__Remitente:-}
      Smtp__Usuario: ${Smtp__Usuario:-}
      Smtp__Clave: ${Smtp__Clave:-}
      # Compuerta de liberación del plan de cargue por paridad.
      # Vacías por defecto: la función responde 503 "en verificación", sin fallback.
      Cubicacion__ParidadVerificada: ${CUBICACION_PARIDAD_VERIFICADA}
      Cubicacion__ParidadEvidencia: ${CUBICACION_PARIDAD_EVIDENCIA}
      Cubicacion__ParidadFecha: ${CUBICACION_PARIDAD_FECHA}
      # Bearer de las llamadas ENTRANTES del Cubicador (GET /api/lineas-solicitud/{id}/cubicacion);
      # igual a NEXO_CALLBACK_API_KEY en cubicador/.env. Vacía = 401 a cualquier Bearer (fail-closed).
      Cubicador3D__InboundApiKey: ${CUBICADOR3D_INBOUND_API_KEY}
      # Llamadas SALIENTES hacia Cubicador. RecomendacionesApiKey (POST/GET /recomendaciones) debe ser
      # igual a CUBICADOR_API_KEY_NEXO en cubicador/.env; OutboundApiKey (passthrough de catálogo) igual a
      # CUBICADOR_API_KEY (llave genérica, distinta de la de NEXO). Vacías = 503 "no configurado",
      # nunca rompe el arranque.
      Cubicador3D__OutboundBaseUrl: ${CUBICADOR3D_OUTBOUND_BASE_URL}
      Cubicador3D__RecomendacionesApiKey: ${CUBICADOR3D_RECOMENDACIONES_API_KEY}
      Cubicador3D__OutboundApiKey: ${CUBICADOR3D_OUTBOUND_API_KEY}
      # Microservicio MailSender (ver .env.example). Sin este par las claves no llegan al contenedor
      # y el correo cae al SMTP directo en silencio.
      MailSender__BaseUrl: ${MAILSENDER_BASE_URL}
      MailSender__Remitente: ${MAILSENDER_REMITENTE}
      MailSender__TimeoutSegundos: ${MAILSENDER_TIMEOUT_SEGUNDOS:-30}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Recorrido de punta a punta contra la aplicación levantada:
  #
  #   docker compose up -d
  #   docker compose --profile e2e run --rm e2e
  #
  # Cubre lo que la suite (transporte en memoria, bases efímeras) no ve: API real, Outbox contra
  # SQL Server, RabbitMQ con plugin de retardo, saga persistida y SignalR. Va en un perfil para que
  # `docker compose up` no lo arranque; sale con código distinto de cero si algo falla. Solo
  # biblioteca estándar de Python (sin pip), para no depender de la red.
  e2e:
    profiles: ["e2e"]
    image: python:3.12-slim
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE: http://api:8080
    volumes:
      - ./build/e2e:/e2e:ro
    networks:
      - internal
    command: ["python", "/e2e/recorrido.py"]

  # One-shot opcional de seed:  docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: src/Nexo.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Nexo: ${ConnectionStrings__Nexo}
    entrypoint: ["dotnet", "Nexo.Api.dll", "seed"]
    networks:
      - internal
    restart: "no"

  # Cubicador 3D: microservicio Python en cubicador/ con SU PROPIO docker-compose.yml (proyecto
  # Compose separado). Solo comparte el broker `rabbit`, al que se engancha por la red externa
  # `nexo_internal` (fijada por el `name:` de la cabecera de este archivo).

networks:
  internal:

volumes:
  rabbit-data:
