# ============================================================================
# Nexo (Clean Architecture) — despliegue con Docker Compose
#
#   - Este repositorio es SOLO BACKEND (no incluye frontend): la migración
#     a Clean Architecture se acotó explícitamente a src/ del proyecto
#     original. La API queda publicada en el puerto del host (API_PORT,
#     por defecto 8080) para que cualquier frontend (el original NEXO/frontend
#     u otro) la consuma directamente — no hay proxy Nginx aquí.
#   - Plan de cargue: el motor Cubicador es un microservicio
#     Python aparte (carpeta cubicador/ de este mismo repo, su propio
#     docker-compose.yml). NEXO le habla SOLO por colas del mismo RabbitMQ
#     de abajo (ConnectionStrings:RabbitMq) — no hay URL HTTP ni servicio
#     adicional que levantar acá. Sin la compuerta de paridad encendida
#     (Cubicacion__Paridad*, ver .env.example), la función responde 503 "en
#     verificación", nunca cae a un fallback.
#   - El servicio 'db' (SQL Server local en contenedor) está DESHABILITADO:
#     se usa una BD de pruebas/producción real vía ConnectionStrings__Nexo
#     (.env). No se elimina el bloque por si hace falta volver a levantarlo
#     para desarrollo aislado.
#
# Uso:
#   1) cp .env.example .env   y completar los valores (mínimo ConnectionStrings__Nexo).
#   2) docker compose up -d --build
#   3) La API queda en http://localhost:${API_PORT:-8080} (health en /health).
#   4) Sembrar datos demo (opcional, alternativa a MIGRATE_ON_STARTUP=true):
#        docker compose --profile seed run --rm seed
# ============================================================================

name: nexo

services:

  rabbit:
    # Imagen propia: el plugin de retardo que MassTransit necesita para los timeouts
    # de saga no viene en la oficial. Ver build/Dockerfile.rabbit.
    build:
      context: .
      dockerfile: build/Dockerfile.rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:

      - "${RABBITMQ_UI_PORT:-15672}:15672"
      # AMQP también publicado al host: `api` y `cubicador/` (docker-compose.yml
      # propio, proyecto Compose separado que se engancha a esta misma red por
      # nombre externo `nexo_internal`) alcanzan el puerto 5672 igual por esa
      # red interna, sin necesitar esto — lo que sí lo necesita es cualquier
      # herramienta/CI que inspeccione o publique mensajes de prueba desde
      # fuera de Docker (ver cubicador/scripts/ci_docker_smoke.py). Mismo
      # criterio que la consola de arriba: no exponer en un despliegue real.
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Nexo.Api/Dockerfile
    depends_on:
      rabbit:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # 'db' local deshabilitado: se conecta directo a la BD de pruebas real
      # definida en ConnectionStrings__Nexo (.env), no al contenedor.
      ConnectionStrings__Nexo: ${ConnectionStrings__Nexo}
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER:-nexo}:${RABBITMQ_PASSWORD}@rabbit:5672/"
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP}
      # Siembra datos de demostración al arrancar si la BD está vacía (idempotente).
      # Poner en "false" en producción real una vez cargados los datos definitivos.
      Database__SeedOnStartup: ${SEED_ON_STARTUP:-true}
      # Esquema propio de NEXO dentro de ConnectionStrings__Nexo (ver clsEsquemaNexo.cs).
      Database__Esquema: ${Database__Esquema}
      Cors__OrigenesPermitidos: ${ORIGENES_PERMITIDOS_CORS}
      # Recálculo del score persistido (#19). El reloj vive en el broker, no en este
      # proceso, así que cambiar el intervalo solo afecta cada cuánto suena: no hay
      # temporizador en memoria que se duplique con las réplicas.
      Score__IntervaloRecalculoMinutos: ${SCORE_INTERVALO_MINUTOS:-15}
      # Cuántas solicitudes por lote. Existe para no dejar una transacción larga
      # bloqueando filas que la bandeja está leyendo.
      Score__TamanoDeLoteRecalculo: ${SCORE_TAMANO_LOTE:-200}
      # Identidad del portal de la Administración. Vacía en local: cae al
      # adapter que resuelve contra la tabla Usuarios propia (ver .env.example).
      # ASPNETCORE_ENVIRONMENT=Production EXIGE esta cadena (fail-closed).
      ConnectionStrings__IdentidadPortal: ${ConnectionStrings__IdentidadPortal}
      # Data Warehouse corporativo (SOLO LECTURA). Opcionales: si van vacías,
      # los módulos que las usan (Biblioteca/SICE-TAC/histórico/clientes DW)
      # se degradan solos (503 accionable o Configurado=false), no rompen.
      ConnectionStrings__DwSice: ${ConnectionStrings__DwSice}
      ConnectionStrings__DwCubos: ${ConnectionStrings__DwCubos}
      # Conexión SAP nueva: plaza en vivo. Deshabilitado por defecto —
      # la plaza real sigue saliendo de DbSolucionesTi, sin tocar.
      SapTarifaFleteEnVivo__Modo: ${SAP_TARIFA_FLETE_EN_VIVO_MODO}
      ConnectionStrings__DbSolucionesTi: ${ConnectionStrings__DbSolucionesTi}
      # SMTP corporativo (envío de cotizaciones). Opcional: sin Host/Remitente no
      # envía. Nombres en español: SmtpCorreoAdapter lee Smtp:Puerto/Remitente/
      # Usuario/Clave (no Port/From/User/Password).
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Puerto: ${Smtp__Puerto:-}
      Smtp__Ssl: ${Smtp__Ssl:-}
      Smtp__Remitente: ${Smtp__Remitente:-}
      Smtp__Usuario: ${Smtp__Usuario:-}
      Smtp__Clave: ${Smtp__Clave:-}
      # Compuerta de liberación del plan de cargue por paridad.
      # Vacías por defecto: la función responde 503 "en verificación", sin fallback.
      Cubicacion__ParidadVerificada: ${CUBICACION_PARIDAD_VERIFICADA}
      Cubicacion__ParidadEvidencia: ${CUBICACION_PARIDAD_EVIDENCIA}
      Cubicacion__ParidadFecha: ${CUBICACION_PARIDAD_FECHA}
      # Bearer de las llamadas ENTRANTES del Cubicador (GET /api/lineas-solicitud/{id}
      # /cubicacion) — debe ser igual a NEXO_CALLBACK_API_KEY en cubicador/.env. Vacía =
      # el endpoint responde 401 a cualquier Bearer (fail-closed).
      Cubicador3D__InboundApiKey: ${CUBICADOR3D_INBOUND_API_KEY}
      # Llamadas HTTP SALIENTES de NEXO hacia Cubicador. S5-HU-18.1/#273: POST/GET
      # /recomendaciones (reemplaza al retirado POST /api/cubicacion) — RecomendacionesApiKey
      # debe ser igual a CUBICADOR_API_KEY_NEXO en cubicador/.env. S5-HU-18.6/#278: los seis
      # passthrough de catálogo (§3.2) — OutboundApiKey debe ser igual a CUBICADOR_API_KEY
      # (la llave GENÉRICA, distinta de la de NEXO). Vacías = 503 "no configurado", nunca
      # rompe el arranque.
      Cubicador3D__OutboundBaseUrl: ${CUBICADOR3D_OUTBOUND_BASE_URL}
      Cubicador3D__RecomendacionesApiKey: ${CUBICADOR3D_RECOMENDACIONES_API_KEY}
      Cubicador3D__OutboundApiKey: ${CUBICADOR3D_OUTBOUND_API_KEY}
      # Microservicio MailSender (#21, ver .env.example). Mismo defecto ya corregido una
      # vez para Cubicador3D: sin este par, .env.example documenta las claves pero nunca
      # llegan al contenedor y la salida de correo cae al SMTP directo en silencio.
      MailSender__BaseUrl: ${MAILSENDER_BASE_URL}
      MailSender__Remitente: ${MAILSENDER_REMITENTE}
      MailSender__TimeoutSegundos: ${MAILSENDER_TIMEOUT_SEGUNDOS:-30}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Recorrido de punta a punta contra la aplicación levantada.
  #
  #   docker compose up -d
  #   docker compose --profile e2e run --rm e2e
  #
  # Comprueba lo que la suite no puede: la suite corre con transporte en memoria y
  # bases efímeras —rápida y bien aislada, y por eso mismo ciega a si las piezas
  # encajan de verdad—. Esto habla con el API real, con el Outbox entregando contra
  # SQL Server, RabbitMQ con su plugin de retardo, la saga persistida y SignalR
  # empujando a un cliente de verdad.
  #
  # No es teórico: así se encontró que el arranque de la cadena de priorización
  # publicaba al Outbox sin guardar, cosa que ninguna prueba veía porque ninguna
  # publica a través del Outbox.
  #
  # Va en un perfil para que `docker compose up` no lo arranque. Sale con código
  # distinto de cero si algo falla, así que sirve tal cual en un pipeline.
  #
  # Solo biblioteca estándar de Python: sin pip, para que no falle por una red que
  # intercepta TLS en vez de por el código.
  e2e:
    profiles: ["e2e"]
    image: python:3.12-slim
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE: http://api:8080
    volumes:
      - ./build/e2e:/e2e:ro
    networks:
      - internal
    command: ["python", "/e2e/recorrido.py"]

  # One-shot opcional de seed:  docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: src/Nexo.Api/Dockerfile
    # depends_on: db: deshabilitado junto con el servicio 'db' de arriba (BD de pruebas real).
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Nexo: ${ConnectionStrings__Nexo}
    entrypoint: ["dotnet", "Nexo.Api.dll", "seed"]
    networks:
      - internal
    restart: "no"

  # ---------------------------------------------------------------------
  # Cubicador 3D — microservicio Python. Vive en cubicador/ dentro de este
  # mismo repo, con SU PROPIO docker-compose.yml (proyecto Compose separado:
  # despliegue independiente, no forma parte de este `docker compose up`).
  # No está aquí como servicio porque no comparte ciclo de vida ni base de
  # datos con este stack — solo comparte el broker `rabbit` de arriba, al que
  # cubicador/ se conecta enganchándose a la red `internal` por su nombre
  # externo (`nexo_internal`, fijado por el `name:` de la cabecera de este
  # archivo). Ver cubicador/docker-compose.yml y
  # cubicador/docs/DECISIONES_TECNICAS.md #9.
  # ---------------------------------------------------------------------

networks:
  internal:

volumes:
  rabbit-data:
