# Arnés de integración continua de NEXO: compila y corre pruebas, no levanta la aplicación (para
# eso está el docker-compose.yml de la raíz).
#
#   docker compose -f docker-compose.ci.yml build && \
#   docker compose -f docker-compose.ci.yml run --rm build
#
# El `&&` NO es opcional: si la construcción falla (p. ej. un .sln mal formado), `run` arrancaría con
# la imagen ANTERIOR y compilaría código viejo, un verde falso. El código de salida del contenedor es
# el del compilador, que es lo que lee el workflow de GitHub Actions.
name: nexo-ci

services:
  # Compila las 4 capas y los 3 proyectos de test en Release.
  build:
    build:
      context: .
      dockerfile: build/Dockerfile.ci
    image: nexo-ci:local
    command: ["dotnet", "build", "Nexo.Clean.sln", "-c", "Release", "--no-restore"]

  # SQL Server efímero para las pruebas de integración (no es la base corporativa): sin volumen,
  # para que ninguna prueba dependa de lo que dejó la anterior.
  db-pruebas:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TEST_DB_PASSWORD:-Pruebas_Nexo_2026!}
      MSSQL_PID: Developer
    networks:
      - ci
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # TODAS las pruebas de la solución en una corrida, con la base levantada:
  #
  #   docker compose -f docker-compose.ci.yml build && \
  #   docker compose -f docker-compose.ci.yml run --rm pruebas
  #
  # Sin filtro y sobre el .sln: correr las suites por separado con filtros deja huecos sin que nadie
  # lo note, y un proyecto de pruebas nuevo entra solo.
  pruebas:
    image: nexo-ci:local
    depends_on:
      db-pruebas:
        condition: service_healthy
    environment:
      TEST_DB_CONNECTION: "Server=db-pruebas,1433;Database=Nexo_Test;User Id=sa;Password=${TEST_DB_PASSWORD:-Pruebas_Nexo_2026!};TrustServerCertificate=True;Encrypt=True;"
      # db-pruebas nace vacía en cada corrida: aquí SÍ hay que crear el esquema (a diferencia de la
      # base corporativa real, donde este flag debe quedar OFF, ver ApiFixture.cs).
      TEST_DB_MIGRATE_ON_STARTUP: "true"
      # OBLIGATORIA (ver clsEsquemaNexo.cs): sin ella OnModelCreating falla antes de migrar.
      Database__Esquema: db_NEXO
    networks:
      - ci
    command:
      - dotnet
      - test
      - Nexo.Clean.sln
      - -c
      - Release
      - --no-restore

  # Pruebas de integración: las que necesitan una base de verdad porque lo que
  # verifican es el comportamiento transaccional del motor.
  #
  #   docker compose -f docker-compose.ci.yml run --rm pruebas-integracion
  pruebas-integracion:
    image: nexo-ci:local
    depends_on:
      db-pruebas:
        condition: service_healthy
    environment:
      TEST_DB_CONNECTION: "Server=db-pruebas,1433;Database=Nexo_Test;User Id=sa;Password=${TEST_DB_PASSWORD:-Pruebas_Nexo_2026!};TrustServerCertificate=True;Encrypt=True;"
      # Mismo motivo que en 'pruebas' arriba - db-pruebas nace vacía.
      TEST_DB_MIGRATE_ON_STARTUP: "true"
      # OBLIGATORIA (ver clsEsquemaNexo.cs), mismo motivo que en 'pruebas' arriba.
      Database__Esquema: db_NEXO
    networks:
      - ci
    command:
      - dotnet
      - test
      - tests/Nexo.Api.Tests
      - -c
      - Release
      - --no-restore
      - --filter
      - Categoria=Integracion

  # Corre la suite localmente contra la base REAL corporativa (esquema db_NEXO, la misma de
  # dev/producción) en vez de una SQL Server efímera, para validar comportamiento real.
  #
  # Diferencias con 'pruebas'/'pruebas-integracion':
  #   - No depende de db-pruebas ni se une a la red 'ci': necesita salir a la red corporativa/VPN
  #     (la red por defecto de Compose ya permite salida NAT).
  #   - TEST_DB_MIGRATE_ON_STARTUP queda SIN DEFINIR a propósito (ver clsApiFixture.cs): el login de
  #     pruebas no tiene permisos DDL y, si el esquema no está desplegado, los tests deben fallar con
  #     un error de SQL claro en vez de migrar solos.
  #   - TEST_DB_CONNECTION toma el valor de ConnectionStrings__Nexo del .env, que Compose lee directo.
  #
  #   docker compose -f docker-compose.ci.yml build && \
  #   docker compose -f docker-compose.ci.yml run --rm pruebas-reales
  pruebas-reales:
    image: nexo-ci:local
    environment:
      TEST_DB_CONNECTION: ${ConnectionStrings__Nexo}
      ConnectionStrings__DwSice: ${ConnectionStrings__DwSice}
      ConnectionStrings__DbSolucionesTi: ${ConnectionStrings__DbSolucionesTi}
      ConnectionStrings__DwCubos: ${ConnectionStrings__DwCubos}
      ConnectionStrings__IdentidadPortal: ${ConnectionStrings__IdentidadPortal}
      Database__Esquema: ${Database__Esquema}
    command:
      - dotnet
      - test
      - tests/Nexo.Api.Tests
      - -c
      - Release
      - --no-restore

  # Igual que 'pruebas-reales' (misma base corporativa, sin migrar el esquema), pero sobre TODA la
  # solución en vez de solo Nexo.Api.Tests.
  #
  #   docker compose -f docker-compose.ci.yml build && \
  #   docker compose -f docker-compose.ci.yml run --rm pruebas-reales-completas
  pruebas-reales-completas:
    image: nexo-ci:local
    environment:
      TEST_DB_CONNECTION: ${ConnectionStrings__Nexo}
      ConnectionStrings__DwSice: ${ConnectionStrings__DwSice}
      ConnectionStrings__DbSolucionesTi: ${ConnectionStrings__DbSolucionesTi}
      ConnectionStrings__DwCubos: ${ConnectionStrings__DwCubos}
      ConnectionStrings__IdentidadPortal: ${ConnectionStrings__IdentidadPortal}
      Database__Esquema: ${Database__Esquema}
    command:
      - dotnet
      - test
      - Nexo.Clean.sln
      - -c
      - Release
      - --no-restore


networks:
  ci:
