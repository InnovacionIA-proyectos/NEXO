# ============================================================================
# Arnés de integración continua de NEXO.
#
# No levanta la aplicación: compila. Para correr la API con su SQL Server está
# el docker-compose.yml de la raíz, que es otra cosa y se usa en otro momento.
#
#   docker compose -f docker-compose.ci.yml build && \
#   docker compose -f docker-compose.ci.yml run --rm build
#
# El `&&` NO es opcional. Si la construcción de la imagen falla —por ejemplo con
# un .sln mal formado, que rompe el restore— `run` arranca igual con la imagen
# ANTERIOR y compila código viejo. El resultado es un verde falso, que es peor
# que un rojo. Encadenar los dos comandos lo hace imposible.
#
# El código de salida del contenedor es el del compilador: 0 compila, distinto
# de 0 no. Eso es lo que va a leer el workflow de GitHub Actions.
# ============================================================================
name: nexo-ci

services:
  # Compila las 4 capas y los 3 proyectos de test en Release.
  build:
    build:
      context: .
      dockerfile: build/Dockerfile.ci
    image: nexo-ci:local
    command: ["dotnet", "build", "Nexo.Clean.sln", "-c", "Release", "--no-restore"]

  # SQL Server efímero para las pruebas de integración. NO es la base corporativa
  # ni pretende serlo: nace y muere con la corrida, sin volumen, para que ninguna
  # prueba dependa de lo que dejó la anterior.
  db-pruebas:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TEST_DB_PASSWORD:-Pruebas_Nexo_2026!}
      MSSQL_PID: Developer
    networks:
      - ci
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # TODAS las pruebas de la solución en una corrida, con la base levantada.
  #
  #   docker compose -f docker-compose.ci.yml build &&   #   docker compose -f docker-compose.ci.yml run --rm pruebas
  #
  # Existe porque correr las suites por separado y con filtros deja huecos sin que
  # nadie se dé cuenta: pasó con las pruebas de integración de Api.Tests, que se
  # quedaron sin correr varias sesiones porque el filtro por categoría las excluía
  # y el verde de las demás tapaba el hueco.
  #
  # Sin filtro y sobre el .sln: si alguien agrega un proyecto de pruebas, entra solo.
  pruebas:
    image: nexo-ci:local
    depends_on:
      db-pruebas:
        condition: service_healthy
    environment:
      TEST_DB_CONNECTION: "Server=db-pruebas,1433;Database=Nexo_Test;User Id=sa;Password=${TEST_DB_PASSWORD:-Pruebas_Nexo_2026!};TrustServerCertificate=True;Encrypt=True;"
      # db-pruebas nace vacía en cada corrida (sin volumen, ver arriba) -
      # a diferencia de TEST_DB_CONNECTION contra la base corporativa real (donde este
      # flag debe quedar OFF a propósito, ver ApiFixture.cs), acá SÍ hay que crear el
      # esquema o los 171 tests de Api.Tests fallan contra una base sin tablas.
      TEST_DB_MIGRATE_ON_STARTUP: "true"
      # OBLIGATORIA (ver clsEsquemaNexo.cs) — sin ella, OnModelCreating explota antes
      # de llegar a migrar, mismo error para los 75 tests que usan clsApiFixture.
      Database__Esquema: db_NEXO
    networks:
      - ci
    command:
      - dotnet
      - test
      - Nexo.Clean.sln
      - -c
      - Release
      - --no-restore

  # Pruebas de integración: las que necesitan una base de verdad porque lo que
  # verifican es el comportamiento transaccional del motor.
  #
  #   docker compose -f docker-compose.ci.yml run --rm pruebas-integracion
  pruebas-integracion:
    image: nexo-ci:local
    depends_on:
      db-pruebas:
        condition: service_healthy
    environment:
      TEST_DB_CONNECTION: "Server=db-pruebas,1433;Database=Nexo_Test;User Id=sa;Password=${TEST_DB_PASSWORD:-Pruebas_Nexo_2026!};TrustServerCertificate=True;Encrypt=True;"
      # Mismo motivo que en 'pruebas' arriba - db-pruebas nace vacía.
      TEST_DB_MIGRATE_ON_STARTUP: "true"
      # OBLIGATORIA (ver clsEsquemaNexo.cs), mismo motivo que en 'pruebas' arriba.
      Database__Esquema: db_NEXO
    networks:
      - ci
    command:
      - dotnet
      - test
      - tests/Nexo.Api.Tests
      - -c
      - Release
      - --no-restore
      - --filter
      - Categoria=Integracion

  # Corre la suite de tests LOCALMENTE contra la base REAL corporativa
  # (dbInformesAutomatizados_Pruebas, esquema db_NEXO — la misma que usa la app
  # en dev/producción) en vez de una SQL Server efímera, porque acá se necesita
  # validar comportamiento real, no solo contra una base recién creada y vacía.
  #
  # Diferencias contra 'pruebas'/'pruebas-integracion' de arriba:
  #   - NO depende de db-pruebas: no hay SQL Server efímero en este servicio.
  #   - NO se une a la red aislada 'ci': necesita salir a la red corporativa/VPN
  #     para alcanzar 10.10.40.85 (el default network de Compose ya permite
  #     salida NAT, igual que el host).
  #   - TEST_DB_MIGRATE_ON_STARTUP se deja SIN DEFINIR a propósito (ver
  #     clsApiFixture.cs): el login de pruebas (userInformesOw) no tiene
  #     permisos DDL y no debe tenerlos — si el esquema no está desplegado,
  #     los tests deben fallar con un error de SQL claro, no migrar solos.
  #   - TEST_DB_CONNECTION toma el mismo valor que ConnectionStrings__Nexo de
  #     .env: Compose lee ese .env directamente (sin pasar por ninguna shell/
  #     PowerShell), así que no hay riesgo de que la variable no propague.
  #
  #   docker compose -f docker-compose.ci.yml build && \
  #   docker compose -f docker-compose.ci.yml run --rm pruebas-reales
  pruebas-reales:
    image: nexo-ci:local
    environment:
      TEST_DB_CONNECTION: ${ConnectionStrings__Nexo}
      ConnectionStrings__DwSice: ${ConnectionStrings__DwSice}
      ConnectionStrings__DbSolucionesTi: ${ConnectionStrings__DbSolucionesTi}
      ConnectionStrings__DwCubos: ${ConnectionStrings__DwCubos}
      ConnectionStrings__IdentidadPortal: ${ConnectionStrings__IdentidadPortal}
      Database__Esquema: ${Database__Esquema}
    command:
      - dotnet
      - test
      - tests/Nexo.Api.Tests
      - -c
      - Release
      - --no-restore

  # Igual que 'pruebas-reales' de arriba (misma base corporativa, mismo motivo
  # para no migrar el esquema), pero sobre TODA la solucion en vez de solo
  # Nexo.Api.Tests - para cuando se necesita correr localmente la suite
  # completa contra datos reales, no solo la de integracion de la API.
  #
  #   docker compose -f docker-compose.ci.yml build && \
  #   docker compose -f docker-compose.ci.yml run --rm pruebas-reales-completas
  pruebas-reales-completas:
    image: nexo-ci:local
    environment:
      TEST_DB_CONNECTION: ${ConnectionStrings__Nexo}
      ConnectionStrings__DwSice: ${ConnectionStrings__DwSice}
      ConnectionStrings__DbSolucionesTi: ${ConnectionStrings__DbSolucionesTi}
      ConnectionStrings__DwCubos: ${ConnectionStrings__DwCubos}
      ConnectionStrings__IdentidadPortal: ${ConnectionStrings__IdentidadPortal}
      Database__Esquema: ${Database__Esquema}
    command:
      - dotnet
      - test
      - Nexo.Clean.sln
      - -c
      - Release
      - --no-restore


networks:
  ci:
