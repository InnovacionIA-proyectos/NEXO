name: (reusable) Pruebas de Cubicador

# Workflow REUSABLE (on: workflow_call): no dispara solo; lo llaman ci-cd-cubicador-api.yml y
# ci-cd-cubicador-worker.yml.
#
# api y worker comparten el mismo código Python y el mismo docker-compose.yml, y pytest y el smoke
# test de Docker Compose ya ejercitan el stack integrado (api + worker + base de datos + RabbitMQ).
# Por eso este job vive UNA sola vez aquí, y no en copias que puedan divergir.
on:
  workflow_call:

jobs:
  unit-tests:
    name: Pruebas unitarias y de integracion (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        working-directory: cubicador
        run: pip install -r requirements.txt

      - name: "pytest: motor + api + worker, todas contra SQLite en memoria"
        working-directory: cubicador
        run: pytest -v

  docker-smoke:
    name: Verificacion contra Docker Compose real (Postgres + RabbitMQ + api + worker)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias (el script de verificacion usa httpx/aio-pika)
        working-directory: cubicador
        run: pip install -r requirements.txt

      # Valores dummy solo para este runner efímero, nunca secretos reales. MSSQL_SA_PASSWORD debe cumplir
      # la política de SQL Server (8+ caracteres con mayúscula, minúscula, número y símbolo) o el
      # contenedor `db` no arranca. Se usa el SQL Server LOCAL del compose, nunca la base compartida de
      # QA: corre en cada push y dos ejecuciones simultáneas se pisarían.
      # NEXO_BASE_URL/NEXO_CALLBACK_API_KEY no se usan: crear-desde-linea necesita un NEXO real aparte.
      - name: Crear .env para el stack (RabbitMQ apunta al broker compartido de NEXO)
        working-directory: cubicador
        run: |
          cat > .env <<'EOF'
          MSSQL_SA_PASSWORD=Ci_Password_123
          CUBICADOR_DB_ESQUEMA=dbo
          RABBITMQ_USER=ci_user
          RABBITMQ_PASSWORD=ci_password
          CUBICADOR_API_KEY=ci-api-key
          CUBICADOR_API_KEY_NEXO=ci-api-key-nexo
          CUBICADOR_API_KEY_COTIFLY=ci-api-key-cotifly
          NEXO_CALLBACK_API_KEY=ci-nexo-key
          NEXO_BASE_URL=http://localhost:5080
          EOF

      # cubicador/ no trae su propio RabbitMQ: se conecta al `rabbit` compartido del docker-compose.yml
      # raíz por la red externa `nexo_internal`. Solo se levanta ese servicio (no depende de db/api).
      - name: Levantar el rabbit compartido de NEXO
        run: |
          echo -e "RABBITMQ_USER=ci_user\nRABBITMQ_PASSWORD=ci_password" > .env
          docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 60 rabbit

      - name: Levantar el stack de cubicador y esperar a que los 3 contenedores esten sanos
        working-directory: cubicador
        run: docker compose up -d --build --wait --wait-timeout 180

      # `unit-tests` corre contra SQLite, más permisivo que SQL Server (`columna IS 0` es válido en
      # SQLite y error 102 en SQL Server), así que esa familia de fallos le es invisible.
      # Este paso es el único que ejecuta SQL contra el motor de producción y va DENTRO del contenedor
      # porque trae el ODBC Driver 18. `CUBICADOR_EXIGIR_MSSQL=1` convierte el salto en FALLO: sin eso un
      # typo en el servicio o la clave haría desaparecer la prueba con el job en verde.
      # La clave sale del .env escrito arriba, no repetida aquí, para no tener dos copias que diverjan.
      - name: "pytest: las consultas del plan de cargue, contra el SQL Server del stack"
        working-directory: cubicador
        run: |
          # Por `grep` y no por `source`: el .env lleva comentarios con
          # espacios y sourcearlo los ejecuta como comandos.
          CLAVE=$(grep '^MSSQL_SA_PASSWORD=' .env | cut -d= -f2-)
          docker compose exec -T \
            -e MSSQL_SA_PASSWORD="$CLAVE" \
            -e CUBICADOR_EXIGIR_MSSQL=1 \
            api python -m pytest tests/infrastructure/test_plan_cargue_repo_contra_sqlserver.py -v

      - name: Flujo async (optimizar) + reintentos/Dead-Letter Queue contra el stack real
        working-directory: cubicador
        env:
          CUBICADOR_API_KEY: ci-api-key
          CUBICADOR_API_KEY_NEXO: ci-api-key-nexo
          CUBICADOR_API_KEY_COTIFLY: ci-api-key-cotifly
          RABBITMQ_USER: ci_user
          RABBITMQ_PASSWORD: ci_password
        run: python scripts/ci_docker_smoke.py

      - name: Logs del stack (solo si algo fallo)
        if: failure()
        working-directory: cubicador
        run: docker compose logs

      - name: Logs del rabbit compartido (solo si algo fallo)
        if: failure()
        run: docker compose -f docker-compose.yml logs rabbit

      - name: Bajar el stack de cubicador
        if: always()
        working-directory: cubicador
        run: docker compose down -v

      - name: Bajar el rabbit compartido de NEXO
        if: always()
        run: docker compose -f docker-compose.yml down -v
