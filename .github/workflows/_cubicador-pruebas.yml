name: (reusable) Pruebas de Cubicador

# Workflow REUSABLE (on: workflow_call) — no dispara solo, ver ci-cd-cubicador-api.yml
# y ci-cd-cubicador-worker.yml, que son los que de verdad se disparan por push/PR.
#
# api y worker comparten la MISMA base de código Python
# (domain/, application/, infrastructure/) y el mismo docker-compose.yml — no hay
# forma (ni falta que haga) de correr "solo las pruebas del api" o "solo las del
# worker": pytest y el smoke test de Docker Compose ya ejercitan el stack
# integrado (api + worker + Postgres + RabbitMQ juntos). Por eso este job vive
# UNA sola vez acá y los dos workflows de servicio lo llaman — así, cuando algo
# compartido cambia y dispara los dos pipelines, no corren dos
# copias del mismo texto que puedan divergir con el tiempo.
#
# Reemplaza a cubicador-ci.yml (ya retirado): mismo contenido exacto,
# solo que ahora cada servicio decide CUÁNDO llamarlo (paths filter propio) y
# qué hacer si pasa (su propio job de deploy).
on:
  workflow_call:

jobs:
  unit-tests:
    name: Pruebas unitarias y de integracion (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        working-directory: cubicador
        run: pip install -r requirements.txt

      - name: "pytest: motor + api + worker, todas contra SQLite en memoria"
        working-directory: cubicador
        run: pytest -v

  docker-smoke:
    name: Verificacion contra Docker Compose real (Postgres + RabbitMQ + api + worker)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias (el script de verificacion usa httpx/aio-pika)
        working-directory: cubicador
        run: pip install -r requirements.txt

      # Valores dummy validos solo para este runner efimero - nunca secretos reales.
      # NEXO_BASE_URL/NEXO_CALLBACK_API_KEY quedan sin usar en este smoke test (no
      # se ejercita crear-desde-linea, que depende de un NEXO real corriendo aparte
      # - ver cubicador/docs/testDocumentation/PRUEBAS_DE_INTEGRACION.md seccion 2.6).
      - name: Crear .env para el stack (RabbitMQ apunta al broker compartido de NEXO)
        working-directory: cubicador
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci_password
          RABBITMQ_USER=ci_user
          RABBITMQ_PASSWORD=ci_password
          CUBICADOR_API_KEY=ci-api-key
          NEXO_CALLBACK_API_KEY=ci-nexo-key
          NEXO_BASE_URL=http://localhost:5080
          EOF

      # cubicador/ ya no trae su propio RabbitMQ (ver docs/DECISIONES_TECNICAS.md
      # #9): se conecta al `rabbit` compartido del docker-compose.yml raiz via la
      # red externa `nexo_internal`. Solo se levanta ese servicio (no toda NEXO:
      # `rabbit` no depende de `db`/`api`, asi que esto no arranca SQL Server ni
      # el backend C#).
      - name: Levantar el rabbit compartido de NEXO
        run: |
          echo -e "RABBITMQ_USER=ci_user\nRABBITMQ_PASSWORD=ci_password" > .env
          docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 60 rabbit

      - name: Levantar el stack de cubicador y esperar a que los 3 contenedores esten sanos
        working-directory: cubicador
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Flujo async (optimizar) + reintentos/Dead-Letter Queue contra el stack real
        working-directory: cubicador
        env:
          CUBICADOR_API_KEY: ci-api-key
          RABBITMQ_USER: ci_user
          RABBITMQ_PASSWORD: ci_password
        run: python scripts/ci_docker_smoke.py

      - name: Logs del stack (solo si algo fallo)
        if: failure()
        working-directory: cubicador
        run: docker compose logs

      - name: Logs del rabbit compartido (solo si algo fallo)
        if: failure()
        run: docker compose -f docker-compose.yml logs rabbit

      - name: Bajar el stack de cubicador
        if: always()
        working-directory: cubicador
        run: docker compose down -v

      - name: Bajar el rabbit compartido de NEXO
        if: always()
        run: docker compose -f docker-compose.yml down -v
