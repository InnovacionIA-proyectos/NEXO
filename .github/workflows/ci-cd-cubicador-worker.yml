name: CI/CD Cubicador-Worker

# Los `paths` de este workflow y los de ci-cd-cubicador-api.yml son IDENTICOS a proposito; el
# razonamiento completo esta en el encabezado de ese archivo y en docs/despliegue/CI_CD_RUTAS_COMPARTIDAS.md.
# En breve: el job de pruebas es uno solo y ejercita api+worker juntos, y las dos imagenes hacen
# `COPY . .`, asi que cualquier archivo bajo cubicador/ cambia las dos. Lo unico distinto es a que
# aplicacion de Dokploy le avisan.
#
# El worker importa de cubicador/api/ (worker/main.py toma `api.dependencias` y `api.dtos.plan_cargue`),
# asi que un filtro que excluya cubicador/api/ desplegaria solo la API y dejaria al worker con codigo roto.
on:
  push:
    branches: [main, DEPLOY]
    paths:
      - "cubicador/**"
      # La documentacion no cambia comportamiento: excluirla evita redesplegar los dos servicios por un README.
      - "!cubicador/docs/**"
      - "!cubicador/**.md"
      # Insumos del job docker-smoke fuera de cubicador/: levanta el rabbit compartido con
      # `docker compose -f docker-compose.yml up --build rabbit`, construido desde build/Dockerfile.rabbit.
      - "docker-compose.yml"
      - "build/Dockerfile.rabbit"
      - ".github/workflows/ci-cd-cubicador-worker.yml"
      - ".github/workflows/_cubicador-pruebas.yml"
  pull_request:
    branches: [main, DEPLOY]
    paths:
      - "cubicador/**"
      - "!cubicador/docs/**"
      - "!cubicador/**.md"
      - "docker-compose.yml"
      - "build/Dockerfile.rabbit"
      - ".github/workflows/ci-cd-cubicador-worker.yml"
      - ".github/workflows/_cubicador-pruebas.yml"

jobs:
  build-and-test:
    uses: ./.github/workflows/_cubicador-pruebas.yml

  deploy:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEPLOY') && github.event_name == 'push'
    runs-on: [self-hosted, dokploy_]
    steps:
      - name: Mostrar información del deploy
        shell: cmd
        run: |
          echo Branch: ${{ github.ref }}
          echo Commit: ${{ github.sha }}
          echo Evento: ${{ github.event_name }}

      - name: Disparar despliegue en Dokploy (Cubicador-Worker)
        shell: cmd
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL_CUBICADOR_WORKER }}" ^
            -H "Content-Type: application/json" ^
            -H "X-GitHub-Event: push" ^
            -d "{\"ref\":\"${{ github.ref }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"}}"

      # Este servicio no tiene endpoint HTTP (sin healthcheck propio, ver cubicador/docker-compose.yml),
      # asi que no hay nada que sondear para confirmar el redeploy. Pendiente de que Dokploy exponga un
      # endpoint de estado de despliegue por app (fuera del repo).
