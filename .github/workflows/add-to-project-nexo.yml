name: Agregar issues al tablero Seguimiento Nexo
on:
  issues:
    types: [opened, labeled]
jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/InnovacionIA-proyectos/projects/6
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: nexo, tarea-tecnica
          label-operator: AND
