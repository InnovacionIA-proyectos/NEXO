name: CI/CD Cubicador-API

# Los `paths` de este workflow y los de ci-cd-cubicador-worker.yml son IDENTICOS a proposito:
#
# 1) El gate es compartido: ambos llaman a _cubicador-pruebas.yml, que corre `pytest -v` sobre TODA la
#    suite (incluye tests/worker/) y un smoke de Docker Compose con api + worker + base + RabbitMQ.
#    Un cambio solo del worker puede poner en rojo este pipeline.
# 2) Las dos imagenes contienen todo el arbol (`COPY . .` en cubicador/Dockerfile y
#    cubicador/Dockerfile.worker): cualquier archivo bajo cubicador/ cambia las DOS imagenes, y
#    desplegar una sola dejaria a la otra con un commit distinto contra el mismo esquema y protocolo de cola.
#
# Lo unico que distingue a los dos workflows es a que aplicacion de Dokploy le avisan. Separar por
# carpeta (cubicador/api/** aca, cubicador/worker/** alla) no sirve: worker/main.py importa
# `api.dependencias` y `api.dtos.plan_cargue`. Ver docs/despliegue/CI_CD_RUTAS_COMPARTIDAS.md.
on:
  push:
    branches: [main, DEPLOY]
    paths:
      - "cubicador/**"
      # La documentacion no cambia comportamiento: excluirla evita redesplegar los dos servicios por un README.
      - "!cubicador/docs/**"
      - "!cubicador/**.md"
      # Insumos del job docker-smoke que viven FUERA de cubicador/: levanta el rabbit compartido con
      # `docker compose -f docker-compose.yml up --build rabbit`, construido desde build/Dockerfile.rabbit.
      - "docker-compose.yml"
      - "build/Dockerfile.rabbit"
      - ".github/workflows/ci-cd-cubicador-api.yml"
      - ".github/workflows/_cubicador-pruebas.yml"
  pull_request:
    branches: [main, DEPLOY]
    paths:
      - "cubicador/**"
      - "!cubicador/docs/**"
      - "!cubicador/**.md"
      - "docker-compose.yml"
      - "build/Dockerfile.rabbit"
      - ".github/workflows/ci-cd-cubicador-api.yml"
      - ".github/workflows/_cubicador-pruebas.yml"

jobs:
  build-and-test:
    uses: ./.github/workflows/_cubicador-pruebas.yml

  deploy:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEPLOY') && github.event_name == 'push'
    runs-on: [self-hosted, dokploy_]
    steps:
      - name: Mostrar información del deploy
        shell: cmd
        run: |
          echo Branch: ${{ github.ref }}
          echo Commit: ${{ github.sha }}
          echo Evento: ${{ github.event_name }}

      - name: Disparar despliegue en Dokploy (Cubicador-API)
        shell: cmd
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL_CUBICADOR_API }}" ^
            -H "Content-Type: application/json" ^
            -H "X-GitHub-Event: push" ^
            -d "{\"ref\":\"${{ github.ref }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"}}"
