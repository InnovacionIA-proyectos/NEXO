name: CI/CD RabbitMQ

# RabbitMQ no tiene codigo propio: se define en el servicio `rabbit` del docker-compose.yml raiz y en
# build/Dockerfile.rabbit (RabbitMQ oficial + plugin de retardo que MassTransit necesita para los
# timeouts de saga). cubicador/ no define su propio broker: usa este por la red externa `nexo_internal`
# (ver docs/mensajeria/TOPOLOGIA.md). Por eso este pipeline dispara solo con esos 2 archivos.
on:
  push:
    branches: [main, DEPLOY]
    paths:
      - "docker-compose.yml"
      - "build/Dockerfile.rabbit"
      - ".github/workflows/ci-cd-rabbitmq.yml"
  pull_request:
    branches: [main, DEPLOY]
    paths:
      - "docker-compose.yml"
      - "build/Dockerfile.rabbit"
      - ".github/workflows/ci-cd-rabbitmq.yml"

jobs:
  # Solo build: no hay suite unitaria para un broker sin codigo propio, pero la imagen propia puede
  # dejar de construir y sin este job se descubriria recien en el despliegue.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen propia de RabbitMQ (con el plugin de retardo)
        run: docker build -f build/Dockerfile.rabbit -t rabbit-ci:local .

  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEPLOY') && github.event_name == 'push'
    runs-on: [self-hosted, dokploy_]
    steps:
      - name: Mostrar información del deploy
        shell: cmd
        run: |
          echo Branch: ${{ github.ref }}
          echo Commit: ${{ github.sha }}
          echo Evento: ${{ github.event_name }}

      - name: Disparar despliegue en Dokploy (RabbitMQ)
        shell: cmd
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL_RABBITMQ }}" ^
            -H "Content-Type: application/json" ^
            -H "X-GitHub-Event: push" ^
            -d "{\"ref\":\"${{ github.ref }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"}}"
