name: CI/CD API

# Solo dispara por cambios que puedan afectar a la API (.NET), nunca por cambios exclusivos de
# cubicador/, que tiene sus propios workflows. Ver docs/despliegue/CI_CD_RUTAS_COMPARTIDAS.md.
on:
  push:
    branches: [main, DEPLOY]
    paths:
      - "src/**"
      - "tests/**"
      - "Nexo.Clean.sln"
      - ".github/workflows/ci-cd-api.yml"
  pull_request:
    branches: [main, DEPLOY]
    paths:
      - "src/**"
      - "tests/**"
      - "Nexo.Clean.sln"
      - ".github/workflows/ci-cd-api.yml"

jobs:
  # Self-hosted: TEST_DB_CONNECTION apunta a una base SQL Server real de la red corporativa privada,
  # inalcanzable desde un runner en la nube de GitHub. No es una base descartable ni un contenedor efímero.
  build-and-test:
    runs-on: [self-hosted, dokploy_]
    # Este runner solo tiene Windows PowerShell (ejecución de scripts restringida) y cmd, no pwsh.
    # Sin este default, un "run:" sin "shell:" cae en PowerShell y falla con "la ejecución de scripts
    # está deshabilitada en este sistema".
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      # DOTNET_INSTALL_DIR explícito: por defecto setup-dotnet instala en "C:\Program Files\dotnet",
      # donde la cuenta del runner (dokploy_) no tiene permiso de escritura. runner.tool_cache sí es
      # escribible; el paso siguiente agrega esa carpeta al PATH porque setup-dotnet solo lo hace para
      # la ubicación por defecto.
      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Agregar dotnet al PATH
        shell: cmd
        run: echo ${{ runner.tool_cache }}\dotnet>>"%GITHUB_PATH%"

      - name: Restaurar dependencias
        run: dotnet restore Nexo.Clean.sln

      - name: Compilar (Release)
        run: dotnet build Nexo.Clean.sln -c Release --no-restore

      # Nexo.Api.Tests corre contra la BD de pruebas REAL de la red corporativa (nunca un contenedor
      # efímero); TEST_DB_CONNECTION es un secreto de GitHub, nunca un valor en el repo. El .sln completo
      # se corre sin filtro para que un proyecto de test nuevo entre solo.
      #
      # CRÍTICO: ApiFixture.cs NUNCA debe llamar Database.EnsureDeleted() mientras TEST_DB_CONNECTION
      # apunte a esta base, o este workflow la borraría. Migrate() es aditivo y DataSeeder.SeedAsync es
      # idempotente, pero algún test individual podría asumir una base prístina y chocar en una segunda
      # corrida por datos únicos.
      #
      # No hay service container de SQL Server: la base ya está corriendo y es alcanzable desde el runner.
      #
      # Las otras 4 conexiones (SOLO LECTURA) son OPCIONALES: sin ellas la app las degrada sola (503
      # accionable / adapter local) y TarifasHistoricasTests/TarifasSicetacTests/SesionTests pasan por el
      # camino DEGRADADO, no contra las fuentes reales. Se definen con el nombre que lee IConfiguration
      # (ConnectionStrings__*, doble guion bajo).
      #
      # Cubicador3D__* (OPCIONALES): 6 pruebas de Nexo.Api.Tests hablan con el Cubicador REAL; este runner
      # no lo levanta, así que sin estas variables esas pruebas se OMITEN con un motivo explícito
      # (clsHechoConCubicadorRealAttribute). Para que corran: crear los 3 secretos con un Cubicador
      # alcanzable desde el runner (catálogo local sembrado, ver cubicador/docker-compose.yml). Si la URL
      # está definida y el Cubicador no responde, FALLAN. Un secreto inexistente llega como cadena vacía.
      - name: "Ejecutar toda la suite (dotnet test Nexo.Clean.sln)"
        env:
          TEST_DB_CONNECTION: ${{ secrets.TEST_DB_CONNECTION }}
          Cubicador3D__OutboundBaseUrl: ${{ secrets.CUBICADOR3D_OUTBOUND_BASE_URL }}
          Cubicador3D__RecomendacionesApiKey: ${{ secrets.CUBICADOR3D_RECOMENDACIONES_API_KEY }}
          Cubicador3D__OutboundApiKey: ${{ secrets.CUBICADOR3D_OUTBOUND_API_KEY }}
          ConnectionStrings__DwSice: ${{ secrets.CONNECTIONSTRINGS_DWSICE }}
          ConnectionStrings__DbSolucionesTi: ${{ secrets.CONNECTIONSTRINGS_DBSOLUCIONESTI }}
          ConnectionStrings__DwCubos: ${{ secrets.CONNECTIONSTRINGS_DWCUBOS }}
          ConnectionStrings__IdentidadPortal: ${{ secrets.CONNECTIONSTRINGS_IDENTIDADPORTAL }}
          Database__Esquema: ${{ secrets.DATABASE_ESQUEMA }}
        run: dotnet test Nexo.Clean.sln -c Release --no-build --logger "console;verbosity=normal"

  # El despliegue depende de que la suite haya pasado en ESTE commit. Solo en push directo (no en PRs).
  # Dokploy construye con el Dockerfile del servicio API al recibir el webhook.
  deploy:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEPLOY') && github.event_name == 'push'

    # Self-hosted: único lugar desde el que se alcanza el webhook de Dokploy (inalcanzable desde ubuntu-latest).
    runs-on: [self-hosted, dokploy_]
    steps:
      - name: Mostrar información del deploy
        shell: cmd
        run: |
          echo Branch: ${{ github.ref }}
          echo Commit: ${{ github.sha }}
          echo Evento: ${{ github.event_name }}

      - name: Disparar despliegue en Dokploy (servicio API)
        shell: cmd
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL_API }}" ^
            -H "Content-Type: application/json" ^
            -H "X-GitHub-Event: push" ^
            -d "{\"ref\":\"${{ github.ref }}\",\"repository\":{\"full_name\":\"${{ github.repository }}\"}}"

      # El webhook solo confirma que Dokploy RECIBIÓ la orden; luego debe hacer pull/build/recrear el
      # contenedor. Esta espera evita que el primer intento de verificación caiga en el hueco entre el
      # contenedor viejo detenido y el nuevo sin responder.
      # ping en vez de timeout: el runner corre como servicio de Windows sin consola y "timeout" falla
      # al instante ("No es compatible la redirección de entradas"). -n 91 = 90 intervalos de 1s.
      # - name: Esperar a que el contenedor termine de levantar (90s)
      #   shell: cmd
      #   run: ping -n 91 127.0.0.1 >NUL

      # El webhook (curl -f en verde con cualquier 2xx) no garantiza que el build/deploy terminó: un build
      # fallido (p. ej. disco lleno) deja a Dokploy sirviendo la imagen vieja con el job en verde. Este
      # paso detecta al menos que el contenedor nuevo nunca volvió a responder.
      #
      # Límite conocido: un health-check simple no distingue "se redesplegó bien" de "el contenedor VIEJO
      # sigue sano"; eso exigiría exponer el commit SHA desplegado (en /health o /version) y compararlo
      # con github.sha.
      #
      # 30 intentos x 10s (~5 min): la conexión desde fuera de la red corporativa cae de forma
      # intermitente y una ventana de 2 min fallaba en falso con el servicio ya sano. Los reintentos
      # salen apenas el servicio responde, sin quemar minutos de runner.
      #
      # El curl de diagnóstico (sin -f, nunca falla el step) imprime el HTTP real de cada intento para
      # distinguir un timeout de red, un 502/503 de Dokploy o un /health Unhealthy (ver clsProgram.cs).
      # - name: Verificar que el servicio respondio saludable tras el despliegue
      #   shell: cmd
      #   run: |
      #     set INTENTOS=0
      #     :verificar
      #     set /a INTENTOS+=1
      #     echo Intento %INTENTOS%:
      #     curl -s -o NUL -w "  HTTP %%{http_code}\n" "${{ secrets.HEALTH_CHECK_URL_API }}/health"
      #     curl -f -s -o NUL "${{ secrets.HEALTH_CHECK_URL_API }}/health"
      #     if not errorlevel 1 goto exito
      #     if %INTENTOS% GEQ 30 goto fallo
      #     ping -n 11 127.0.0.1 >NUL
