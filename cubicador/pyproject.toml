[project]
name = "cubicador"
version = "0.1.0"
description = "Microservicio de Cubicacion: cubicador rapido (SICCE) + motor de bin-packing 3D (Plan de Cargue), portado de cabinaFletes/NEXO."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domain*", "application*", "infrastructure*", "api*", "worker*"]
