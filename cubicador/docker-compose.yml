# S5-HU-17.1: la base paso de Postgres propio a SQL Server. En QA y produccion
# el Cubicador NO tiene base propia - vive en el esquema `dbo_cubicador` de
# `dbTarifario_Nexo_Pruebas`, que COMPARTE CON COTIFLY (`dbo_cotifly`). NEXO
# no esta ahi: usa su propia base `Nexo`. Este compose levanta un SQL Server
# LOCAL que imita
# esa forma (misma base, mismo esquema, otro host) para desarrollo y para el
# smoke test de CI; ahi no se toca la base compartida.
#
# Ver DECISIONES_TECNICAS.md #9: el broker de mensajeria tampoco es propio -
# se conecta al `rabbit` compartido
# del docker-compose.yml raiz de NEXO via un nombre de red EXTERNO
# (nexo_internal, fijado por el `name:` de ese archivo). Requiere que el
# stack raiz de NEXO ya tenga corriendo (o corra) el servicio `rabbit`:
#   cd .. && docker compose up -d --wait rabbit
# antes de (o en paralelo con) `docker compose up` en esta carpeta - no hay
# `depends_on` posible entre proyectos Compose distintos, por eso
# infrastructure/mensajeria/rabbitmq.py reintenta la conexion inicial con
# margen generoso (ver ese archivo) en vez de asumir que el broker ya esta.

services:
  db:
    # 2019 para igualar la instancia real de QA. OJO: docker-compose.ci.yml de
    # la raiz (pruebas .NET) usa 2022 - son instancias distintas, no un
    # descuido, pero conviene saberlo si algo se comporta diferente.
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?definir en .env}
      MSSQL_PID: Developer
    volumes:
      # Volumen PROPIO de SQL Server. `db_data` NO se reutiliza: todavia tiene
      # los datos de PostgreSQL (uid 70), que hay que MIGRAR, no perder. Ademas
      # SQL Server corre con otro usuario y no puede escribir en ese directorio:
      # el contenedor entra en bucle de reinicio con "Permission denied".
      - db_data_mssql:/var/opt/mssql
    ports:
      - "1434:1433"  # puerto distinto de 1433 por si corre junto a otro SQL Server local
    healthcheck:
      # La imagen 2019 trae sqlcmd en /opt/mssql-tools; las mas nuevas en
      # /opt/mssql-tools18 (que exige -C para aceptar el certificado propio).
      # Se prueban los dos para no depender de la version exacta del tag.
      test:
        - CMD-SHELL
        - >
          (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1")
          > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s  # SQL Server tarda bastante mas que Postgres en quedar listo
    restart: unless-stopped

  # Crea la base y el esquema una sola vez y termina. El DDL de
  # docs/Database/ESQUEMA_CUBICADOR.sql crea tablas, pero no la BASE ni el
  # esquema: sin este paso el primer arranque falla con "Cannot open
  # database". En QA/produccion no existe - la base y el esquema ya estan.
  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?definir en .env}
      CUBICADOR_DB_ESQUEMA: ${CUBICADOR_DB_ESQUEMA:-dbo_cubicador}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C"
        else
          SQLCMD="/opt/mssql-tools/bin/sqlcmd"
        fi
        $$SQLCMD -S db -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q \
          "IF DB_ID('dbTarifario_Nexo_Pruebas') IS NULL CREATE DATABASE [dbTarifario_Nexo_Pruebas];"
        $$SQLCMD -S db -U sa -P "$$MSSQL_SA_PASSWORD" -b -d dbTarifario_Nexo_Pruebas -Q \
          "IF SCHEMA_ID('$$CUBICADOR_DB_ESQUEMA') IS NULL EXEC('CREATE SCHEMA [$$CUBICADOR_DB_ESQUEMA]');"
        echo "Base y esquema $$CUBICADOR_DB_ESQUEMA listos."
        # Las 5 tablas del motor 3D (vehiculos_cubicacion, planes_cargue...) las crea el DDL de
        # docs/Database/ESQUEMA_CUBICADOR.sql: desde que se retiro Alembic (S5-HU-17.2) nada las crea
        # solo, y sin ellas GET /api/planes-cargue/vehiculos responde 503 ("Invalid object name
        # 'dbo_cubicador.vehiculos_cubicacion'") y el smoke de CI nunca pasa. Se aplica SOLO si la
        # tabla no existe: el DDL no es idempotente y este servicio corre en cada `docker compose up`.
        # En QA/produccion este servicio no existe: ahi las tablas ya estan.
        EXISTE=$$($$SQLCMD -S db -U sa -P "$$MSSQL_SA_PASSWORD" -h -1 -W -d dbTarifario_Nexo_Pruebas -Q \
          "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables t JOIN sys.schemas s ON s.schema_id = t.schema_id WHERE s.name = '$$CUBICADOR_DB_ESQUEMA' AND t.name = 'vehiculos_cubicacion'" | tr -d '[:space:]')
        if [ "$$EXISTE" = "0" ]; then
          $$SQLCMD -S db -U sa -P "$$MSSQL_SA_PASSWORD" -b -d dbTarifario_Nexo_Pruebas -i /sql/esquema_motor3d.sql
          echo "Tablas del motor 3D creadas."
        else
          echo "Tablas del motor 3D ya existen."
        fi
    volumes:
      - ./docs/Database/ESQUEMA_CUBICADOR.sql:/sql/esquema_motor3d.sql:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Apunta al SQL Server LOCAL de este compose, no a la base compartida.
      # `sa` solo existe aca: en QA/produccion se define DATABASE_URL entera
      # como variable de entorno (ver .env.dokploy).
      DATABASE_URL: mssql+aioodbc://sa:${MSSQL_SA_PASSWORD}@db:1433/dbTarifario_Nexo_Pruebas?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      CUBICADOR_DB_ESQUEMA: ${CUBICADOR_DB_ESQUEMA:-dbo_cubicador}
      CUBICADOR_API_KEY: ${CUBICADOR_API_KEY:?definir en .env}
      # Llave por sistema: de aca sale el origenSistema verificado de
      # POST /recomendaciones (ver .env.example).
      CUBICADOR_API_KEY_NEXO: ${CUBICADOR_API_KEY_NEXO:-}
      CUBICADOR_API_KEY_COTIFLY: ${CUBICADOR_API_KEY_COTIFLY:-}
      # rabbit compartido de NEXO (mismas credenciales que su .env raiz) - ver
      # comentario de cabecera de este archivo.
      CUBICADOR_RABBITMQ_URL: amqp://${RABBITMQ_USER:?definir en .env}:${RABBITMQ_PASSWORD:?definir en .env}@rabbit:5672/
      NEXO_BASE_URL: ${NEXO_BASE_URL:?definir en .env}
      NEXO_CALLBACK_API_KEY: ${NEXO_CALLBACK_API_KEY:?definir en .env}
      # Modo sombra de la IA (apagado por defecto; ver .env.example). Solo lo usa la api.
      IA_SOMBRA_HABILITADA: ${IA_SOMBRA_HABILITADA:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-high}
      IA_SOMBRA_MUESTREO: ${IA_SOMBRA_MUESTREO:-1.0}
      IA_SOMBRA_TOPE_TOKENS_DIA: ${IA_SOMBRA_TOPE_TOKENS_DIA:-1000000}
    ports:
      # El contenedor sigue escuchando en 8000 puertas adentro (Dockerfile);
      # solo cambia el puerto publicado al host, para no chocar con el 8080
      # donde corre el backend .NET de NEXO. Configurable por si 8081 tampoco
      # sirve (ej. CUBICADOR_HOST_PORT=8082 en el .env).
      - "${CUBICADOR_HOST_PORT:-8081}:8000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - default
      - nexo_shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      # Apunta al SQL Server LOCAL de este compose, no a la base compartida.
      # `sa` solo existe aca: en QA/produccion se define DATABASE_URL entera
      # como variable de entorno (ver .env.dokploy).
      DATABASE_URL: mssql+aioodbc://sa:${MSSQL_SA_PASSWORD}@db:1433/dbTarifario_Nexo_Pruebas?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      CUBICADOR_DB_ESQUEMA: ${CUBICADOR_DB_ESQUEMA:-dbo_cubicador}
      CUBICADOR_RABBITMQ_URL: amqp://${RABBITMQ_USER:?definir en .env}:${RABBITMQ_PASSWORD:?definir en .env}@rabbit:5672/
      NEXO_BASE_URL: ${NEXO_BASE_URL:?definir en .env}
      NEXO_CALLBACK_API_KEY: ${NEXO_CALLBACK_API_KEY:?definir en .env}
      # Vigilante de timeouts (ver CONTRATO.md 6.4): un plan que
      # lleve mas de TIMEOUT minutos en 'procesando' se da por perdido - se
      # publica cubicacion.rechazada (TIMEOUT_PROCESAMIENTO) y se marca 'error'.
      # Solo aplican al worker: la api no corre el vigilante.
      CUBICADOR_TIMEOUT_PROCESANDO_MINUTOS: ${CUBICADOR_TIMEOUT_PROCESANDO_MINUTOS:-5}
      CUBICADOR_INTERVALO_VIGILANTE_SEGUNDOS: ${CUBICADOR_INTERVALO_VIGILANTE_SEGUNDOS:-60}
      # Alerta por correo al caer un mensaje en cubicacion.dlq (ver
      # infrastructure/alertas/correo.py). Opcionales: sin ALERTAS_SMTP_HOST
      # se degrada solo (log warning, no rompe el worker) - ver ese archivo.
      ALERTAS_SMTP_HOST: ${ALERTAS_SMTP_HOST:-}
      ALERTAS_SMTP_PUERTO: ${ALERTAS_SMTP_PUERTO:-587}
      ALERTAS_SMTP_SSL: ${ALERTAS_SMTP_SSL:-true}
      ALERTAS_SMTP_REMITENTE: ${ALERTAS_SMTP_REMITENTE:-cubicador@local}
      ALERTAS_SMTP_USUARIO: ${ALERTAS_SMTP_USUARIO:-}
      ALERTAS_SMTP_CLAVE: ${ALERTAS_SMTP_CLAVE:-}
      ALERTAS_EQUIPO_TECNICO: ${ALERTAS_EQUIPO_TECNICO:-}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - default
      - nexo_shared
    # Sin política de reinicio, un crash del worker (p. ej. RabbitMQ del stack raíz de
    # NEXO todavía no listo cuando este arrancó) lo deja detenido para siempre: la
    # cubicación se queda encolada en cubicador.optimizar sin que nadie la consuma, y
    # nada lo notifica porque este servicio no tiene healthcheck HTTP. Es el candidato
    # más probable a "todo se queda y nunca vuelve a salir, ni cubicación ni el worker".
    restart: unless-stopped

networks:
  default: {}
  nexo_shared:
    name: nexo_internal
    external: true

volumes:
  # Datos de SQL Server (el motor actual).
  db_data_mssql:
  # Datos viejos de PostgreSQL. Se conservan hasta migrarlos (S5-HU-17.1):
  # aqui estan los planes de cargue que ya existen. No borrar antes de eso.
  db_data:
